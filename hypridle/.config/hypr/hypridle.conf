general {
  # The shell's lock screen (Lock.qml).
  lock_cmd = qs -c hyprpunk ipc call lock lock
  # At once, without the animation: it would wait frozen and play on waking.
  before_sleep_cmd = qs -c hyprpunk ipc call lock lockInstantly
  # Sleep waits until the screens are locked: by default hypridle only waits for
  # hyprlock, and the screen as it was showed on waking before the lock.
  inhibit_sleep = 3
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
  timeout = 30
  # The ipc call tells the Quickshell bar not to show an OSD for this change.
  on-timeout = qs -c hyprpunk ipc call osd ignoreNextChange keyboard; $HOME/Scripts/keyboard-backlight.sh off
  on-resume = qs -c hyprpunk ipc call osd ignoreNextChange keyboard; $HOME/Scripts/keyboard-backlight.sh restore
}

listener {
  timeout = 300
  on-timeout = qs -c hyprpunk ipc call osd ignoreNextChange screen; brightnessctl -s set 10
  on-resume = qs -c hyprpunk ipc call osd ignoreNextChange screen; brightnessctl -r
}

listener {
  timeout = 330
  on-timeout = loginctl lock-session && hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
  timeout = 1800
  on-timeout = systemctl suspend
}
