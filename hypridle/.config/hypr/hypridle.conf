general {
  # Locking goes through the shell's own lock screen
  lock_cmd = qs -c hyprpunk ipc call lock lock
  # Before sleep, lock at once: an animation would freeze and only play on waking
  before_sleep_cmd = qs -c hyprpunk ipc call lock lockInstantly
  # Hold the sleep until the screens are locked, so the desktop never flashes on waking
  inhibit_sleep = 3
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 seconds: keyboard backlight off (the shell skips its OSD for this one)
listener {
  timeout = 30
  on-timeout = qs -c hyprpunk ipc call osd ignoreNextChange keyboard; $HOME/Scripts/keyboard-backlight.sh off
  on-resume = qs -c hyprpunk ipc call osd ignoreNextChange keyboard; $HOME/Scripts/keyboard-backlight.sh restore
}

# 5 minutes: dim the screen, quietly too
listener {
  timeout = 300
  on-timeout = qs -c hyprpunk ipc call osd ignoreNextChange screen; brightnessctl -c backlight -s set 10
  on-resume = qs -c hyprpunk ipc call osd ignoreNextChange screen; brightnessctl -c backlight -r
}

# 5 and a half minutes: lock and turn the screens off
listener {
  timeout = 330
  on-timeout = loginctl lock-session && hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 minutes: suspend
listener {
  timeout = 1800
  on-timeout = systemctl suspend
}
