# tmux, with Vim-like keys that follow your keyboard layout. Plugins come through tpm,
# and prefix + R reloads this file. Yours go in personal.conf, next to it.

###########
# OPTIONS #
###########

# Kitty's full colors, the system clipboard, and images passed through to the terminal
set -g default-terminal 'xterm-kitty'
set -as terminal-overrides ',xterm-kitty:RGB'
set -g xterm-keys on
set -g set-clipboard on
set-option -g allow-passthrough on

# Click, scroll and resize with the mouse
set -g mouse on

# Windows keep the name you give them
set -g automatic-rename off
set -g allow-rename off

# Count windows and panes from 1, like the keyboard, and close the gaps
set-option -g base-index 1
set-option -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vi keys in copy mode
set -g mode-keys vi

###############
# KEYBINDINGS #
###############

# Ctrl+S as the prefix, easier to reach than Ctrl+B
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Home and End work in every app inside tmux
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Prefix + R reloads this file
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message -d 800 "Reloaded  "

# Prefix + V splits top and bottom, prefix + H side by side
unbind '"'
unbind %
bind v split-window -v
bind h split-window -h

# Copy mode, pane moves and the session picker's preview scrolling follow the keyboard
# layout, written by keyboard-layoutctl.sh. Skipped quietly until it has run.
%if "#{!=:$XDG_STATE_HOME,}"
source-file -q "$XDG_STATE_HOME/hyprpunk/keyboard/tmux.conf"
%else
source-file -q ~/.local/state/hyprpunk/keyboard/tmux.conf
%endif

# Select like in Vim: V to start, Ctrl+V for a block, Y to copy
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Prefix + B and N for the previous and next window
unbind p
unbind n
bind b previous-window
bind n next-window

###########
# STYLING #
###########

# Catppuccin Mocha, then the wallpaper's palette over it, written by matugen. They're
# options rather than variables so the styles read them when drawn, after the palette's
# file has been read.
set -g @primary "#cba6f7"
set -g @secondary "#b4befe"
set -g @text "#cdd6f4"
set -g @surface0 "#313244"
set -g @base "#1e1e2e"
set -g @red "#f38ba8"
set -g @blue "#89b4fa"
%if "#{!=:$XDG_STATE_HOME,}"
source-file -q "$XDG_STATE_HOME/hyprpunk/tmux-colors.conf"
%else
source-file -q ~/.local/state/hyprpunk/tmux-colors.conf
%endif

# Selection in the accent. When you search, the match you're on is in the accent and the
# others in the secondary color
set -g mode-style "bg=#{@primary},fg=#{@base}"
set -g copy-mode-current-match-style "bg=#{@primary},fg=#{@base}"
set -g copy-mode-match-style "bg=#{@secondary},fg=#{@base}"

# Rounded and pointed caps for the pills, from the Nerd Font
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"

# The bar sits on top, sessions on the left, windows in the middle, command and time on the right
set -g status-position top
set-option -g status-style "bg=#{@surface0},fg=#{@base}"
# Centred on the whole bar, so long names on either side don't push the windows off centre
set-option -g status-justify absolute-centre

# Session name, red while the prefix is pressed
set-option -g status-left "\
#{?client_prefix,\
#[fg=#{@red}]#[bg=default]${HALF_ROUND_OPEN}\
#[bg=#{@red}]#[fg=#{@base}] #S \
#[fg=#{@red}]#[bg=default]${TRIANGLE_CLOSE},\
#[fg=#{@primary}]#[bg=default]${HALF_ROUND_OPEN}\
#[bg=#{@primary}]#[fg=#{@base}] #S \
#[fg=#{@primary}]#[bg=default]${TRIANGLE_CLOSE}}"

# Current command and time
set-option -g status-right "\
#[fg=#{@secondary},bg=default]${TRIANGLE_OPEN}\
#[bg=#{@secondary},fg=#{@base}]  #{pane_current_command} \
#[fg=#{@primary},bg=#{@secondary}]${TRIANGLE_OPEN}\
#[bg=#{@primary},fg=#{@base}]  #(date '+%H:%M') \
#[fg=#{@primary},bg=default]${HALF_ROUND_CLOSE}\
"

# Room for long session names
set-option -g status-left-length 100
set-option -g status-right-length 100

# Windows, the active one in the accent
set-option -g window-status-format "\
#[fg=#{@base},bg=default]${HALF_ROUND_OPEN}\
#[bg=#{@base},fg=#{@text}]#I\
#[bg=#{@base},fg=#{@red}]:\
#[bg=#{@base},fg=#{@text}]#W\
#[fg=#{@base},bg=default]${HALF_ROUND_CLOSE}\
"

set-option -g window-status-current-format "\
#[fg=#{@primary},bg=default]${HALF_ROUND_OPEN}\
#[bg=#{@primary},fg=default]#I\
#[fg=#{@base}]:\
#[fg=default]#W\
#[fg=#{@primary},bg=default]${HALF_ROUND_CLOSE}\
"

# Messages and pane borders
set -g message-style "bg=#{@surface0},fg=#{@text}"

set -g pane-border-style "fg=#{@blue}"
set -g pane-active-border-style "fg=#{@primary}"

###########
# PLUGINS #
###########

# Sensible defaults, your sessions saved every 15 minutes (prefix + Shift+S saves them
# now, prefix + Ctrl+R brings them back after a reboot), yank to the clipboard,
# Ctrl+hjkl shared with Neovim, and a session picker
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'

# Saving takes Shift+S: resurrect's own Ctrl+S would take over prefix + Ctrl+S, which
# has to send a real Ctrl+S to the app since it's the prefix
set -g @resurrect-save 'S'

# Ctrl+\ jumps back to the last pane
set -g @vim_navigator_mapping_prev "C-\\"

# Session picker on prefix + O: no zoxide, no auto-accept, a big preview on the right
set -g @sessionx-bind "o"
set -g @sessionx-auto-accept 'off'
set -g @sessionx-window-height '50%'
set -g @sessionx-window-width '50%'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-fzf-builtin-tmux 'off'
set -g @sessionx-window-mode 'off'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '70%'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-bind-kill-session 'ctrl-x'
set -g @sessionx-bind-configuration-path 'ctrl-c'
set -g @sessionx-bind-rename-session 'ctrl-r'
set -g @sessionx-bind-abort 'ctrl-q'

############
# PERSONAL #
############

# Your own settings, kept out of git and skipped if missing. Read last so they win,
# but before tpm so the plugins you add there get installed too.
source-file -q ~/.config/tmux/personal.conf

###############################
# TPM, always at the very end #
###############################

run '~/.config/tmux/plugins/tpm/tpm'
