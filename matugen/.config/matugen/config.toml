# The GTK and Qt colors, written by matugen so both toolkits share them. Every wallpaper
# has its own palette (palettes.conf names it, palettes/ holds them): the wallpaper's own
# hues at Catppuccin Mocha's lightness, so the theme stays dark and readable.
# wallpaperctl.sh renders the wallpaper's palette whenever it changes.

[config]
# Read last, over the palette: red, green, yellow, peach and blue mean something, they
# never change
import_json_files = ["./meanings.json"]

# The HyprPunk theme imports it. Setting the theme again, through an empty name, makes
# open GTK 3 apps read it anew, and sets it in the first place.
[templates.gtk3]
input_path = "./templates/gtk3.css.template"
output_path = "~/.local/share/themes/HyprPunk/gtk-3.0/colors.css"
post_hook = "gsettings set org.gnome.desktop.interface gtk-theme '' && gsettings set org.gnome.desktop.interface gtk-theme HyprPunk"

# Open GTK 4 apps watch this file themselves, through gtk4-live-css
[templates.gtk4]
input_path = "./templates/gtk4.css.template"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.kvantum-svg]
input_path = "./templates/kvantum.svg.template"
output_path = "~/.config/Kvantum/HyprPunk/HyprPunk.svg"

[templates.kvantum-config]
input_path = "./templates/kvantum.kvconfig.template"
output_path = "~/.config/Kvantum/HyprPunk/HyprPunk.kvconfig"

# The palette of every Qt app, set by qt5ct and qt6ct, and of KDE apps' own colors
[templates.qt]
input_path = "./templates/qt.colors.template"
output_path = "~/.local/share/color-schemes/HyprPunk.colors"

# The shell's colors, which Quickshell watches and takes at once
[templates.quickshell]
input_path = "./templates/quickshell.json.template"
output_path = "~/.local/state/hyprpunk/colors.json"

# The login screen's colors, which wallpaperctl.sh hands to SDDM with the login screen
[templates.sddm]
input_path = "./templates/sddm.conf.template"
output_path = "~/.local/state/hyprpunk/login-colors.conf"

# Hyprland's accent, read by colors_state.lua. Reloading Hyprland recolors the borders.
[templates.hyprland]
input_path = "./templates/hyprland.template"
output_path = "~/.local/state/hyprpunk/hypr-colors"
post_hook = "hyprctl reload >/dev/null 2>&1 || true"
