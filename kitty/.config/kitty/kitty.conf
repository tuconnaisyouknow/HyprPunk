# Font
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Apple's emoji rather than whatever the Nerd Font has
symbol_map U+1F300-U+1F6FF Apple Color Emoji

# Keep the block cursor, even where the shell would rather draw a bar
shell_integration no-cursor
cursor_shape block

shell zsh

# Shortcuts that follow the keyboard layout, written by keyboard-layoutctl.sh
include ~/.local/state/hyprpunk/keyboard/kitty.conf

# Catppuccin Mocha
include current-theme.conf

# Text right against the edges, any leftover space goes at the bottom
placement_strategy top
window_padding_width 0
window_padding_height 0
