# Font
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Apple's emoji rather than whatever another font has. Only the characters Unicode
# draws as emoji by default, so text symbols like ✓ or ™ stay in the Nerd Font.
# Faces, people, animals, food, objects and flags
symbol_map U+1F300-U+1F64F,U+1F680-U+1F6FF,U+1F900-U+1F9FF,U+1FA70-U+1FAFF,U+1F1E6-U+1F1FF Apple Color Emoji
# Cards, enclosed letters and ideographs, colored circles and squares
symbol_map U+1F004,U+1F0CF,U+1F18E,U+1F191-U+1F19A,U+1F201,U+1F21A,U+1F22F,U+1F232-U+1F236,U+1F238-U+1F23A,U+1F250-U+1F251,U+1F7E0-U+1F7EB,U+1F7F0 Apple Color Emoji
# The older ones, among the symbols: ⌚ ☕ ⚡ ✅ ❌ ⭐…
symbol_map U+231A-U+231B,U+23E9-U+23EC,U+23F0,U+23F3,U+25FD-U+25FE,U+2614-U+2615,U+2648-U+2653,U+267F,U+2693,U+26A1,U+26AA-U+26AB,U+26BD-U+26BE,U+26C4-U+26C5,U+26CE,U+26D4,U+26EA,U+26F2-U+26F3,U+26F5,U+26FA,U+26FD,U+2705,U+270A-U+270B,U+2728,U+274C,U+274E,U+2753-U+2755,U+2757,U+2795-U+2797,U+27B0,U+27BF,U+2B1B-U+2B1C,U+2B50,U+2B55 Apple Color Emoji

# Keep the block cursor, even where the shell would rather draw a bar
shell_integration no-cursor
cursor_shape block

# Shortcuts that follow the keyboard layout, written by keyboard-layoutctl.sh
include ~/.local/state/hyprpunk/keyboard/kitty.conf

# Catppuccin Mocha
include current-theme.conf

# Text right against the edges, any leftover space goes at the bottom
placement_strategy top
window_padding_width 0
window_padding_height 0
