# GTK 4 apps read this for the same icons, font and cursor as GTK 3. The theme only
# reaches the ones without libadwaita, the others take their colors from gtk.css.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=JetBrainsMono Nerd Font 9
gtk-cursor-theme-name=BreezeX-RosePine-Linux
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
