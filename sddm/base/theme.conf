# SDDM wants a settings file next to every theme. The login screen reads the desktop's
# look here: its colors, its glass (classic or liquid) and the regional formats its clock
# follows (us or fr). These are Catppuccin Mocha and the defaults, until wallpaperctl.sh
# has yours written where every theme's theme.conf.user points, which SDDM reads over
# this file. sddm.sh adds the theme each login screen belongs to (theme=neon or
# daydream), which its wallpapers' folder tells.
[General]
crust=#11111b
base=#1e1e2e
primary=#cba6f7
secondary=#b4befe
red=#f38ba8
glass=classic
region=us
