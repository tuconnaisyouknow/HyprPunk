<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Whatever asks for a plain monospace font gets Ioskeley Mono, the terminal's font.
-->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Ioskeley Mono Term</family>
    </prefer>
  </alias>
  <alias>
    <family>mono</family>
    <prefer>
      <family>Ioskeley Mono Term</family>
    </prefer>
  </alias>
</fontconfig>
