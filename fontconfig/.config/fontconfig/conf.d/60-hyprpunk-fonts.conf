<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Whatever asks for a plain monospace font gets the terminal's font: Ioskeley Mono Term
  with the Nerd Font icons, as fontsctl.py builds it.
-->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>HyprPunk Term</family>
    </prefer>
  </alias>
  <alias>
    <family>mono</family>
    <prefer>
      <family>HyprPunk Term</family>
    </prefer>
  </alias>
</fontconfig>
